<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Radar 報告</title>
<style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#db6d28;--purple:#a371f7;--cyan:#39d5ff}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:20px}.container{max-width:1440px;margin:0 auto}header{text-align:center;padding:28px 0;border-bottom:1px solid var(--border);margin-bottom:28px}header h1{font-size:1.4rem;margin-bottom:6px;letter-spacing:1px}header .sub{color:var(--muted);font-size:.85rem}.backlink{display:inline-block;margin-bottom:14px;font-size:.82rem;color:var(--accent);text-decoration:none}.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:600;font-size:.8rem;margin-top:10px}.badge-green{background:linear-gradient(135deg,#238636,#3fb950)}.badge-warn{background:linear-gradient(135deg,#db6d28,#f85149)}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:22px}.card h2{font-size:.98rem;margin-bottom:12px;color:var(--accent)}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:500;font-size:.74rem}.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--yellow)}.warn{color:var(--orange)}.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.7rem;font-weight:600}.t-bull{background:rgba(63,185,80,.15);color:var(--green)}.t-bear{background:rgba(248,81,73,.15);color:var(--red)}.t-neu{background:rgba(210,153,34,.15);color:var(--yellow)}.t-hold{background:rgba(88,166,255,.15);color:var(--accent)}.mr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}.mr:last-child{border-bottom:none}.mr-l{color:var(--muted);font-size:.8rem}.mr-v{font-weight:600;font-size:.85rem}.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}.pi{background:rgba(255,255,255,.03);border-radius:7px;padding:9px 11px}.pi .tk{font-size:.72rem;color:var(--muted);margin-bottom:1px}.pi .pr{font-size:.95rem;font-weight:700}.pi .ch{font-size:.75rem;margin-top:1px}.risk-bar{height:5px;border-radius:3px;background:var(--border);display:inline-block;width:55px;vertical-align:middle;overflow:hidden}.risk-bar .f{height:100%;border-radius:3px}.rh .f{background:var(--red);width:90%}.rm .f{background:var(--orange);width:60%}.rl .f{background:var(--green);width:30%}.rmh .f{background:var(--orange);width:75%}.tl{position:relative;padding-left:22px}.tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}.tl-i{position:relative;margin-bottom:13px}.tl-i::before{content:'';position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent)}.tl-d{font-size:.76rem;color:var(--accent);font-weight:600}.tl-e{font-size:.8rem;margin-top:2px}.scenario{border-left:3px solid var(--green);padding:10px;margin:8px 0}.scenario-bear{border-left:3px solid var(--red);padding:10px;margin:8px 0}.scenario-tail{border-left:3px solid var(--orange);padding:10px;margin:8px 0}.tactical-box{background:rgba(88,166,255,.04);border:1px solid rgba(88,166,255,.2);border-radius:8px;padding:14px;margin:10px 0}.tool-box{background:rgba(163,113,247,.06);border:1px dashed rgba(163,113,247,.4);border-radius:8px;padding:12px;margin:10px 0}.tool-box h4{color:var(--purple);font-size:.85rem;margin-bottom:6px}.radar-draft{background:rgba(57,213,255,.05);border:1px solid rgba(57,213,255,.3);border-radius:8px;padding:12px;margin:10px 0;font-size:.78rem}.radar-head{color:var(--cyan);font-weight:700;margin-bottom:8px}.radar-panel td{font-size:.76rem}.radar-bull{color:var(--green);margin-top:6px}.radar-bear{color:var(--red);margin-top:6px}.radar-watch{color:var(--muted);margin-top:6px}.radar-draft ul{margin:4px 0 4px 18px}.radar-note{color:var(--muted);font-size:.7rem;margin-top:8px;opacity:.8}.score-card{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.score-item{padding:3px 8px;border-radius:4px;font-size:.72rem;font-weight:600}.sc-pass{background:rgba(63,185,80,.12);color:var(--green)}.sc-fail{background:rgba(248,81,73,.12);color:var(--red)}.sc-neutral{background:rgba(210,153,34,.12);color:var(--yellow)}.st-summary{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.st-tag{padding:3px 9px;border-radius:4px;font-size:.72rem;font-weight:700}.scenario-prob{font-size:.72rem;padding:2px 6px;border-radius:3px;background:rgba(88,166,255,.12);color:var(--accent);font-weight:700}.footer{opacity:.85;font-size:.74rem;color:var(--muted);margin-top:22px;padding:14px;border-top:1px solid var(--border)}.alert{background:#0a1a0a;border:1px solid #238636;border-radius:6px;padding:12px;margin:8px 0}.alert-warn{background:#1a1000;border:1px solid#db6d28;border-radius:6px;padding:12px;margin:8px 0}.opt-box{background:rgba(219,109,40,.06);border:1px solid rgba(219,109,40,.35);border-radius:8px;padding:12px;margin:10px 0;font-size:.78rem}.urpd-box{background:rgba(210,153,34,.06);border:1px solid rgba(210,153,34,.35);border-radius:8px;padding:12px;margin:10px 0;font-size:.78rem}.vpvr-box{background:rgba(88,166,255,.05);border:1px solid rgba(88,166,255,.25);border-radius:8px;padding:10px;margin:8px 0;font-size:.77rem}.t38{background:rgba(63,185,80,.04);border:1px solid rgba(63,185,80,.22);border-radius:8px;padding:12px;margin:10px 0}.t38 h4{color:var(--green);font-size:.86rem;margin-bottom:6px}.t38 .row{font-size:.78rem;margin:3px 0}.t38 .k{color:var(--muted);display:inline-block;min-width:72px}.dash-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}.dash-gauge{font-size:1.9rem;font-weight:800;line-height:1.1}.dash-gl{font-size:.82rem;margin-top:2px}.dash-sub{font-size:.75rem;color:var(--muted);margin-top:2px}.dash-lights{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:8px 0}.dash-light{border-left:3px solid var(--border);background:rgba(255,255,255,.02);border-radius:6px;padding:8px 10px}.dash-light .ln{font-weight:700;font-size:.8rem}.dash-light .ls{font-size:.78rem;margin:2px 0}.dash-light .lw{font-size:.72rem;color:var(--muted)}.dash-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.dash-top,.dash-two{grid-template-columns:1fr}}#err{padding:40px;text-align:center;color:var(--muted)}</style>
</head>
<body>
<div class="container">
  <a class="backlink" href="index.html">← 回報告庫</a>
  <div id="app"><div id="err">載入中…</div></div>
</div>
<script>
// Market Radar JSON 報告 viewer（HD 2026-11-07）：
// report.html?id=YYYY-MM-DD-{am|pm} → fetch data/<id>.json → 前端 render 九區。
// 單一 template + 每期一包 JSON；內容唯一事實來源＝data/<id>.json，欄位由 pre-commit schema validator 把關。
const E = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chcls = d => ({up:'pos',down:'neg'}[d]||'neu');
const signcls = c => {c=String(c).trim(); return c[0]==='-'?'neg':c[0]==='+'?'pos':'neu';};
const scCls = s => { s=String(s); if(/多|bull|✅|利多|偏多/.test(s))return'sc-pass'; if(/空|bear|❌|利空|偏空/.test(s))return'sc-fail'; return'sc-neutral'; };

// 開盤前戰略定調儀表板：資料由 signals/strategic_dashboard.py 的 dashboard_payload() 共用函式產生，
// 這裡用報告自己的暗色 class render（同色調、不用 iframe）。
const TOKCOL = {danger:'var(--red)',warn:'var(--yellow)',ok:'var(--green)',info:'var(--accent)',mut:'var(--muted)'};
function kvTable(rows){
  return '<table>'+rows.map(r=>`<tr><td class="mr-l">${E(r.lbl)}</td><td>${E(r.val)}</td><td class="${signcls(r.chg)}">${E(r.chg)}</td></tr>`).join('')+'</table>';
}
function renderDashboard(x){
  const O=[], roCol = x.riskoff.data_bad ? 'var(--red)' : (parseFloat(x.riskoff.score)>=60?'var(--red)':parseFloat(x.riskoff.score)<=40?'var(--green)':'var(--yellow)');
  O.push(`<div class="card full"><h2>🧭 開盤前戰略定調儀表板（啟發式規則層·非買賣建議·不臆測持倉）</h2>`);
  O.push(`<div class="alert-warn" style="font-size:.8rem">${E(x.summary)}</div>`);
  O.push(`<div class="dash-top" style="margin-top:10px">`);
  O.push(`<div class="tactical-box"><div class="dash-sub">A. 當週風險取向（看趨勢）</div><div class="dash-gauge" style="color:${roCol}">${E(x.riskoff.score)}<span style="font-size:.9rem;color:var(--muted)">/100</span></div><div class="dash-gl" style="color:${roCol}">${E(x.riskoff.label)}</div><div class="dash-sub">0=極度 Risk-On　100=極度 Risk-Off${x.riskoff.stress?'｜股市壓力旗標 ON':''}</div>${kvTable(x.risk_rows)}</div>`);
  O.push(`<div class="tactical-box"><div class="dash-sub">B. 今日日內形態（看形態）</div><div class="dash-gauge" style="color:var(--accent)">${E(x.intraday.single)}%<span style="font-size:.9rem;color:var(--muted)"> 大單邊 / ${E(x.intraday.chop)}% 震盪</span></div><div class="dash-gl">${E(x.intraday.label)}</div><div class="dash-sub" style="margin-bottom:4px">廣度：${E(x.breadth.text)}（多頭 ETF ${x.breadth.up}漲/${x.breadth.dn}跌/共${x.breadth.nn}）</div>${kvTable(x.trend_rows)}</div>`);
  O.push(`</div>`);
  // C 槓桿 ETF
  O.push(`<div class="dash-sub" style="margin:4px 0">C. 目標槓桿 ETF 漲跌 + 量能（RVOL=當日量/20日均，申贖代理）</div>`);
  O.push(`<table><tr><th>組別</th><th>多頭 ETF</th><th>昨漲跌</th><th>反向 ETF</th><th>昨漲跌</th><th>RVOL</th></tr>`);
  x.etf.forEach(e=>O.push(`<tr><td>${E(e.grp)}</td><td>${E(e.long)} <span class="mr-l">${E(e.mult)}多</span></td><td class="${signcls(e.long_chg)}">${E(e.long_chg)}</td><td>${E(e.short)} <span class="mr-l">空</span></td><td class="${signcls(e.short_chg)}">${E(e.short_chg)}</td><td>${E(e.rvol)}</td></tr>`));
  O.push(`</table>`);
  // D 燈號
  O.push(`<div class="dash-sub" style="margin:8px 0 2px">D. 各商品操作燈號（IF/THEN + 硬煞車）</div><div class="dash-lights">`);
  x.lights.forEach(l=>O.push(`<div class="dash-light" style="border-left-color:${TOKCOL[l.tok]||'var(--border)'}"><div class="ln">👉 ${E(l.name)}</div><div class="ls" style="color:${TOKCOL[l.tok]||'var(--text)'}">${E(l.signal)}</div><div class="lw">${E(l.why)}</div></div>`));
  O.push(`</div>`);
  // E 幣安 + F movers
  O.push(`<div class="dash-two" style="margin-top:8px">`);
  O.push(`<div><div class="dash-sub">E. 幣安即時報價（標的 underlying + 貴金屬 + 利率/金礦/BTC腿）</div><table><tr><th>標的</th><th>價格</th><th>24h</th></tr>`+x.binance.map(b=>`<tr><td>${E(b.name)}</td><td>${E(b.price)}</td><td class="${signcls(b.chg)}">${E(b.chg)}</td></tr>`).join('')+`</table></div>`);
  const mvtab=(lst,pos)=>`<table><tr><th>${pos?'📈 5日漲幅前10':'📉 5日跌幅前10'}</th><th>5日%</th><th>現價</th></tr>`+(lst.length?lst.map(m=>`<tr><td>${E(m.sym)}</td><td class="${pos?'pos':'neg'}">${E(m.pct)}</td><td>${E(m.px)}</td></tr>`).join(''):`<tr><td colspan="3" class="mr-l">N/A</td></tr>`)+`</table>`;
  O.push(`<div><div class="dash-sub">F. 幣安美股永續 5 日漲跌榜（196 檔 EQUITY 自動掃描）</div>${mvtab(x.movers_up,true)}</div>`);
  O.push(`</div>`);
  O.push(`<div class="dash-sub" style="margin-top:8px">${mvtab(x.movers_dn,false)}</div>`);
  O.push(`<div class="dash-sub" style="margin-top:8px">⚠ 啟發式規則層(門檻經驗值未回測)、非投資建議、不臆測持倉；🟢綠燈非進場令、🔴紅燈非抄底/反手令。資料源：Yahoo/Deribit/Alternative.me/Binance 永續。生成 ${E(x.generated)}。</div>`);
  O.push(`</div>`);
  return O.join('\n');
}
function render(d){
  const m=d.meta, O=[];
  const badge = ['green','accent','cyan'].includes(m.regime.color)?'badge-green':'badge-warn';
  O.push(`<header><h1>終極宏觀流動性 &amp; AI Capex 量化籌碼雷達 V4.5</h1>`);
  O.push(`<p class="sub">${E(m.date)}（${E(m.type).toUpperCase()}）｜${E(m.generated_tpe)}｜${E(m.us_session)}</p>`);
  O.push(`<div class="badge ${badge}">${E(m.regime.label)}</div></header>`);

  // S0
  const s0=d.s0_backtest;
  O.push(`<div class="card full"><h2>0. 上期預測回顧（${E(s0.prev)}）</h2><p style="font-size:.82rem;margin-bottom:8px">${E(s0.hit_summary)}</p>`);
  O.push(`<table><tr><th>標的</th><th>預測區間</th><th>方向</th><th>實際</th><th>結果</th></tr>`);
  s0.rows.forEach(r=>O.push(`<tr><td>${E(r.sym)}</td><td>${E(r.pred_range)}</td><td>${E(r.pred_dir)}</td><td>${E(r.actual)}</td><td>${E(r.result)}</td></tr>`));
  O.push(`</table><div class="alert" style="margin-top:10px">📘 教訓：${E(s0.lesson)}</div></div>`);

  // 開盤前戰略定調儀表板（資料來自共用 dashboard_payload()）
  if(d.dashboard) O.push(renderDashboard(d.dashboard));

  // S1
  const s1=d.s1_quotes;
  O.push(`<div class="card full"><h2>1. 即時報價面板</h2><div class="price-grid">`);
  s1.assets.forEach(a=>O.push(`<div class="pi"><div class="tk">${E(a.sym)} ${E(a.name)}</div><div class="pr">${E(a.price)}</div><div class="ch ${chcls(a.dir)}">${E(a.chg)}</div></div>`));
  O.push(`</div><div style="margin-top:10px">`);
  [['DXY','dxy'],['VIX','vix'],['MOVE','move'],['美10Y','us10y'],['美30Y','us30y'],['日10Y','jp10y'],['德10Y','de10y'],['HY利差','hy_oas'],['IG利差','ig_oas'],['TAIEX','taiex'],['USD/JPY','usdjpy'],['F&G','fng']].forEach(([lab,k])=>{ if(s1.macro[k]) O.push(`<span class="tag t-hold" style="margin:2px">${E(lab)} ${E(s1.macro[k])}</span>`); });
  O.push(`</div></div>`);

  // S2
  O.push(`<div class="card full"><h2>2. 市場主導 Regime</h2>`);
  d.s2_regime.rows.forEach(r=>O.push(`<div class="mr"><span class="mr-l">${E(r.dim)}</span><span class="mr-v">${E(r.content)}</span></div>`));
  O.push(`</div>`);

  // S3
  const s3=d.s3_consensus;
  O.push(`<div class="card full"><h2>3. 市場共識 vs Reality</h2><table><tr><th>主題</th><th>預期</th><th>實際</th><th>Mispricing</th></tr>`);
  s3.rows.forEach(r=>O.push(`<tr><td>${E(r.theme)}</td><td>${E(r.expect)}</td><td>${E(r.actual)}</td><td>${E(r.mispricing)}</td></tr>`));
  O.push(`</table><div class="alert-warn" style="margin-top:10px">⚠ 最大 Mispricing：${E(s3.alert)}</div></div>`);

  // S4
  O.push(`<div class="card full"><h2>4. 跨資產強弱矩陣</h2><table><tr><th>#</th><th>資產</th><th>24h%</th><th>ST方向</th><th>驅動</th></tr>`);
  d.s4_matrix.rows.forEach(r=>{ const leg=r.leg_tag?` <span class="tag t-neu">${E(r.leg_tag)}</span>`:''; O.push(`<tr><td>${E(r.rank)}</td><td>${E(r.asset)}</td><td class="${signcls(r.chg)}">${E(r.chg)}</td><td>${E(r.st)}</td><td>${E(r.driver)}${leg}</td></tr>`); });
  O.push(`</table></div>`);

  // S5
  const s5=d.s5_risk, sev={5:'rh',4:'rmh',3:'rm',2:'rl',1:'rl'};
  O.push(`<div class="card full"><h2>5. 量化風險雷達</h2><table><tr><th>風險</th><th>機率</th><th>影響</th><th>資產</th><th>嚴重度</th></tr>`);
  s5.risks.forEach(r=>O.push(`<tr><td>${E(r.risk)}</td><td>${E(r.prob)}</td><td>${E(r.impact)}</td><td>${E(r.assets)}</td><td><span class="risk-bar ${sev[r.severity]||'rm'}"><span class="f"></span></span></td></tr>`));
  O.push(`</table><table style="margin-top:10px"><tr><th>資產</th><th>現價</th><th>型態</th><th>依據</th></tr>`);
  s5.setups.forEach(r=>O.push(`<tr><td>${E(r.asset)}</td><td>${E(r.price)}</td><td>${E(r.pattern)}</td><td>${E(r.basis)}</td></tr>`));
  O.push(`</table></div>`);

  // S6
  O.push(`<div class="card full"><h2>6. 完整戰術分析</h2>`);
  const s6=d.s6, titles={xau:'A. 黃金 XAU',xag:'B. 白銀 XAG',btc:'C. 比特幣 BTC',eth:'D. 以太坊 ETH'};
  ['xau','xag','btc','eth'].forEach(key=>{
    const t=s6[key];
    O.push(`<div class="tactical-box"><h4 style="color:var(--accent);margin-bottom:6px">${titles[key]}</h4>`);
    O.push(`<div class="st-summary"><span class="st-tag t-hold">SuperTrend：${E(t.st)}</span></div><div class="score-card">`);
    t.scorecard.forEach(sc=>O.push(`<span class="score-item ${scCls(sc.score)}">${E(sc.factor)}：${E(sc.read)}（${E(sc.score)}）</span>`));
    O.push(`</div><p style="font-size:.8rem;margin:6px 0"><b>24h 預估：</b>${E(t.bias_24h)}</p>`);
    O.push(`<table><tr><th>情境</th><th>進場</th><th>止損</th><th>目標</th><th>風報比</th></tr>`);
    t.ops.forEach(o=>O.push(`<tr><td>${E(o.scenario)}</td><td>${E(o.entry)}</td><td>${E(o.stop)}</td><td>${E(o.target)}</td><td>${E(o.rr)}</td></tr>`));
    O.push(`</table><table style="margin-top:8px"><tr><th>5日情境</th><th>機率</th><th>說明</th></tr>`);
    t.scenarios_5d.forEach(s=>O.push(`<tr><td>${E(s.name)}</td><td>${E(s.prob)}</td><td>${E(s.desc)}</td></tr>`));
    O.push(`</table><p style="font-size:.8rem;margin-top:6px">${E(t.extra)}</p>`);
    if(key==='xag'&&t.signals_box) O.push(`<div class="tool-box"><h4>🔧 signals 工具參考欄（實驗性、非進場依據）</h4><div style="font-size:.77rem">${t.signals_box}</div></div>`);
    if((key==='btc'||key==='eth')&&t.radar_html) O.push(t.radar_html);
    if(key==='btc'&&t.urpd_html) O.push(t.urpd_html);
    O.push(`</div>`);
  });
  // 6-E stocks
  const st=s6.stocks;
  O.push(`<div class="tactical-box"><h4 style="color:var(--accent)">E. 美股焦點</h4><p style="font-size:.8rem;margin:4px 0"><b>🔺 漲幅前段</b></p><table><tr><th>標的</th><th>24h%</th><th>分析</th></tr>`);
  st.gainers.forEach(g=>O.push(`<tr><td>${E(g.sym)}</td><td class="${signcls(g.chg)}">${E(g.chg)}</td><td>${E(g.analysis)}</td></tr>`));
  O.push(`</table><p style="font-size:.8rem;margin:8px 0 4px"><b>🔻 跌幅/弱勢</b></p><table><tr><th>標的</th><th>24h%</th><th>分析</th></tr>`);
  st.losers.forEach(g=>O.push(`<tr><td>${E(g.sym)}</td><td class="${signcls(g.chg)}">${E(g.chg)}</td><td>${E(g.analysis)}</td></tr>`));
  O.push(`</table><p style="font-size:.8rem;margin:8px 0 4px"><b>其餘快評</b></p><table><tr><th>標的</th><th>價格</th><th>24h%</th><th>方向</th><th>關鍵價位</th><th>備註</th></tr>`);
  st.quick.forEach(q=>O.push(`<tr><td>${E(q.sym)}</td><td>${E(q.price)}</td><td class="${signcls(q.chg)}">${E(q.chg)}</td><td>${E(q.dir)}</td><td>${E(q.levels)}</td><td>${E(q.note)}</td></tr>`));
  O.push(`</table></div>`);
  // 6-F MSTR options
  O.push(`<div class="tactical-box"><h4 style="color:var(--accent)">F. MSTR 選擇權籌碼（結構底稿，非進場訊號）</h4>${d.targets_38.MSTR.options_html}</div></div>`);

  // STEP 3.8
  O.push(`<div class="card full"><h2>★ STEP 3.8 五標的型態 / 支撐壓力 / 多空</h2>`);
  const t38=d.targets_38, names={XAU:'黃金 XAU',XAG:'白銀 XAG',SOXX:'半導體 SOXX',BTC:'比特幣 BTC',MSTR:'MSTR'};
  ['XAU','XAG','SOXX','BTC','MSTR'].forEach(sym=>{
    const g=t38[sym];
    O.push(`<!--3.8:${sym}--><div class="t38"><h4>${names[sym]}</h4>`);
    O.push(`<div class="row"><span class="k">型態</span>${E(g.patterns)}</div>`);
    O.push(`<div class="row"><span class="k">SuperTrend</span>${E(g.supertrend)}</div>`);
    O.push(`<div class="row"><span class="k">支撐壓力</span>${E(g.sr)}</div>`);
    O.push(`<div class="row"><span class="k">多空機會</span>${E(g.bias)}</div>`);
    if(sym==='BTC') O.push(`<!--3.8:BTC:urpd-->`+g.urpd_html);
    if(sym==='MSTR') O.push(`<!--3.8:MSTR:opt-->`+g.options_html);
    O.push(`</div>`);
  });
  O.push(`</div>`);

  // S7
  const s7=d.s7_banks;
  O.push(`<div class="card full"><h2>7. 投行觀點與期權結構異常</h2><table><tr><th>來源</th><th>觀點</th><th>影響</th></tr>`);
  s7.rows.forEach(r=>O.push(`<tr><td>${E(r.src)}</td><td>${E(r.view)}</td><td>${E(r.impact)}</td></tr>`));
  O.push(`</table><p style="font-size:.8rem;margin-top:8px">${E(s7.options_structure)}</p></div>`);

  // S8
  const s8=d.s8_calendar;
  O.push(`<div class="card full"><h2>8. 一週核心事件 Calendar（台灣時間）</h2><div class="tl">`);
  s8.events.forEach(e=>O.push(`<div class="tl-i"><div class="tl-d">${E(e.date)}</div><div class="tl-e">${E(e.event)}</div></div>`));
  O.push(`</div><p style="font-size:.8rem;margin-top:8px">${E(s8.ranking)}</p></div>`);

  // S9
  const s9=d.s9_scenarios;
  O.push(`<div class="card full"><h2>9. 一週情境劇本與機率評估</h2><table><tr><th>預測市場</th><th>機率</th><th>備註</th></tr>`);
  s9.prediction_market.forEach(r=>O.push(`<tr><td>${E(r.item)}</td><td>${E(r.prob)}</td><td>${E(r.note)}</td></tr>`));
  O.push(`</table>`);
  [['base','scenario','Base Case'],['bull','scenario','Bull Case'],['bear','scenario-bear','Bear Case'],['tail','scenario-tail','Tail Risk']].forEach(([k,cls,lab])=>{ const sc=s9[k]; O.push(`<div class="${cls}"><span class="scenario-prob">${lab} · ${E(sc.prob)}</span><p style="font-size:.82rem;margin-top:4px">${E(sc.desc)}</p></div>`); });
  O.push(`</div>`);

  // 對抗裁決
  const adv=d.adversarial, vc={CONFIRMED:'pos',PLAUSIBLE:'neu',REFUTED:'neg'};
  O.push(`<div class="card full"><h2>🔴 STEP 3.5 對抗式驗證裁決</h2>`);
  O.push(`<p style="font-size:.8rem">閘門：(a) ±5% = <b>${adv.gate_a?'是':'否'}</b>｜(b) 政策/數據事件 = <b>${adv.gate_b?'是':'否'}</b>｜(c) 持倉動作 = <b>${adv.gate_c?'是':'否'}</b>｜獨立 subagent = <b>${adv.subagent_opened?'已開':'未開'}</b></p>`);
  O.push(`<table style="margin-top:8px"><tr><th>因果宣稱</th><th>裁決</th><th>說明</th></tr>`);
  adv.verdicts.forEach(v=>O.push(`<tr><td>${E(v.claim)}</td><td class="${vc[v.verdict]||'neu'}">${E(v.verdict)}</td><td>${E(v.note)}</td></tr>`));
  O.push(`</table></div>`);

  O.push(`<div class="footer">${E(d.footer)}</div>`);
  document.getElementById('app').innerHTML = O.join('\n');
  document.title = `Market Radar ${m.date}-${m.type}`;
}

(function(){
  const id=(new URLSearchParams(location.search)).get('id')||'';
  if(!/^\d{4}-\d{2}-\d{2}-(am|pm)$/.test(id)){ document.getElementById('err').textContent='缺少或格式錯誤的 id（需 YYYY-MM-DD-am|pm）'; return; }
  fetch('data/'+id+'.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e=>{ document.getElementById('err').textContent='載入 data/'+id+'.json 失敗：'+e.message; });
})();
</script>
</body>
</html>
